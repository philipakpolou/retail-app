
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Retail Store</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="profile.html" class="active">Profile</a>
    <a href="chat.html">Chat</a>
    <a href="auth.html">Login</a>
  </nav>

<section id="profile">
    <h2>Your Profile</h2>
    <p id="profile-name">John Doe</p>
    <h3>Your Listings</h3>
    <div id="user-products"></div>
  </section>

<section id="edit-product" style="display:none;">
    <h2>Edit Product</h2>
    <form id="edit-form">
      <input type="text" id="edit-name" placeholder="Product name" required>
      <input type="number" id="edit-price" placeholder="Price" required>
      <button type="submit">Save Changes</button>
    </form>
</section>

<section id="edit-image" style="display:none;">
  <h2>Edit Product Image</h2>
  <form id="edit-image-form">
    <input type="file" id="new-image" accept="image/*" required>
    <button type="submit">Save New Image</button>
  </form>
</section>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="./firebase.js"></script>
  <script src="./script.js"></script>
</body>
</html>
