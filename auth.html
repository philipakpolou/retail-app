
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Retail Store</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="profile.html">Profile</a>
    <a href="chat.html">Chat</a>
    <a href="auth.html" class="active">Login</a>
    <button id="logout" style="display:none;">Logout</button>
  </nav>
  <div id="page-message" class="message" style="display:none;"></div>

  <section id="auth">
    <h2>Login / Signup</h2>
    
    <div id="auth-message" style="display:none;" class="message"></div>

    <button id="toggle-form" class="form-toggle">Don't have an account? Sign Up</button>

    <form id="login-form" style="display:block;">
      <h3>Login</h3>
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <form id="signup-form" style="display:none;">
      <h3>Sign Up</h3>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <input type="password" id="signup-confirm" placeholder="Confirm Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <button id="google-login" type="button">Login with Google</button>
  </section>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="./firebase.js"></script>
  <script src="./script.js"></script>
</body>
</html>
