<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retail Store - Home</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>Welcome to The Bird Store</h1>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="profile.html">Profile</a>
      <a href="chat.html">Chat</a>
      <a href="auth.html">Login</a>
      <button id="logout" style="display:none;">Logout</button>
    </nav>
    <div id="page-message" class="message" style="display:none;"></div>
  </header>

  <section id="search">
    <input type="text" id="search-box" placeholder="Search products...">
  </section>

  <section id="filters">
    <label for="price-filter">Max Price: </label>
    <input type="number" id="price-filter" placeholder="Enter price">
    <label for="category-filter">Category: </label>
    <select id="category-filter">
      <option value="">All Categories</option>
      <option value="Electronics">Electronics</option>
      <option value="Fashion">Fashion</option>
      <option value="Home">Home</option>
      <option value="Vehicles">Vehicles</option>
      <option value="Others">Others</option>
    </select>
    <button id="apply-filters" type="button">Filter</button>
    <button id="clear-filters" type="button">Clear</button>
  </section>

  <section id="add-product">
    <h2>Post an Ad</h2>
    <form id="product-form">
      <input type="text" id="product-name" placeholder="Product name" required>
      <input type="number" id="product-price" placeholder="Price" required>
      <select id="product-category" required>
        <option value="">Select category</option>
        <option value="Electronics">Electronics</option>
        <option value="Fashion">Fashion</option>
        <option value="Home">Home</option>
        <option value="Vehicles">Vehicles</option>
        <option value="Others">Others</option>
      </select>
      <input type="file" id="product-image" accept="image/*" required>
      <button type="submit">Add Product</button>
    </form>
  </section>

  <section id="products"></section>

  <section id="cart">
    <h2>Your Cart</h2>
    <ul id="cart-items"></ul>
    <p>Total: $<span id="cart-total">0</span></p>
    <div class="profile-actions">
      <button id="checkout-cart" type="button">Checkout</button>
      <button id="clear-cart" type="button">Clear Cart</button>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 The Bird Store. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
  <script src="./firebase.js"></script>
  <script src="./script.js"></script>
